spring.application.name=inter-remittance
spring.datasource.url=jdbc:postgresql://localhost:5432/remittance
spring.datasource.username=remittance
spring.datasource.password=remittance
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.jakarta.persistence.query.timeout=5000
spring.jpa.properties.jakarta.persistence.lock.timeout=3000
spring.transaction.default-timeout=10s

# HikariCP: bounded pool + short timeouts so overload fails fast instead of starving threads.
# Fixed-size pool (min idle = max) avoids connection creation latency during spikes.
# Keep (pool size x replicas) below PostgreSQL max_connections (100).
spring.datasource.hikari.pool-name=remittance-pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1740000
spring.datasource.hikari.leak-detection-threshold=15000

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.data.web.pageable.max-page-size=100
# Quotation cache (see QuotationCacheConfig): short TTL because the BCB publishes several bulletins per day.
app.cache.quotations.ttl=10m
app.cache.quotations.max-size=100
spring.threads.virtual.enabled=true
bcb.ptax.url=https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.bcb-ptax.connect-timeout=2000
spring.cloud.openfeign.client.config.bcb-ptax.read-timeout=5000
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# JWT / API client. The defaults are for local development only: override them via environment variables.
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-real-envs-32b}
app.security.jwt.ttl=${JWT_TTL:1h}
app.security.client.id=${AUTH_CLIENT_ID:remittance-client}
app.security.client.secret=${AUTH_CLIENT_SECRET:remittance-secret}

