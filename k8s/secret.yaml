# Development credentials only. In a real cluster create this Secret out-of-band
# (kubectl create secret / Sealed Secrets / External Secrets) and do not commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: remittance-db-credentials
  labels:
    app.kubernetes.io/part-of: inter-remittance
type: Opaque
stringData:
  POSTGRES_DB: remittance
  POSTGRES_USER: remittance
  POSTGRES_PASSWORD: remittance
